# ========================
# Clash-ALL 优化配置
# ======================== 

# 机场节点订阅 

proxy-providers:
  
  自建:
    url: "https://example.com"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 100
    proxy: 🚀 直连 

  Snippets:
    url: "https://example.com"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 100
    proxy: 🚀 直连 
    
proxies:
  - {name: 🚀 直连, type: direct}
  - {name: 🛑 拒绝, type: reject} 

#下面是链式代理组，如不需要建议删掉
  - name: 🇲🇴MO-香~港
    type: socks5
    server: 
    port: 
    username: 
    password: 
    udp: true
    dialer-proxy: 🇭🇰 香港-手动

  - name: 🇲🇴MO-台~湾
    type: socks5
    server: 
    port: 
    username: 
    password: 
    udp: true
    dialer-proxy: 🇹🇼 台湾-手动    

  - name: 🇰🇵KP-HE
    type: socks5
    server: 
    port: 
    username: 
    password: 
    udp: true
    dialer-proxy: 🇹🇼 台湾-手动

# ========================
# 主要端口设置
# ========================
port: 8080
socks-port: 8899
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895 

allow-lan: true
mode: rule
log-level: info 

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "" 

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  nameserver:
    - 223.5.5.5
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn 

ipv6: true 

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: mixed
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false 

profile:
  store-selected: true
  store-fake-ip: true 

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 🚀 直连
    - 🛑 拒绝
    - ⚡ 自动选择
    - 🖐️ 手动切换
    - 🇭🇰 香港-故转
    - 🇲🇴 澳门-故转
    - 🇹🇼 台湾-故转
    - 🇯🇵 日本-故转
    - 🇰🇷 韩国-故转
    - 🇸🇬 新加坡-故转
    - 🇺🇸 美国-故转
    - 🌍 其他-故转

proxy-groups:
  - {name: ⚡ 自动选择, type: url-test, include-all: true, tolerance: 50, interval: 100, filter: "^((?!(🚀 直连|🛑 拒绝)).)*$"}
  - {name: 🖐️ 手动切换, type: select, include-all: true, filter: "^((?!(🛑 拒绝)).)*$"}
  - {name: 🤖 AI, <<: *default}
  - {name: 🐱 GitHub, <<: *default}
  - {name: ✈️ Telegram, <<: *default}
  - {name: 🐦 Twitter, <<: *default}
  - {name: 🕹️ Game, <<: *default}
  - {name: 📺 YouTube, <<: *default}
  - {name: 🎵 TikTok, <<: *default}
  - {name: 🎥 Netflix, <<: *default}
  - {name: 🎧 Spotify, <<: *default}
  - {name: 🍿 Emby, <<: *default}
  - {name: 💰 Crypto, <<: *default}
  - {name: 🍎 Apple, <<: *default}
  - {name: 🪟 Microsoft, <<: *default}
  - {name: 🔍 Google, <<: *default}
  - {name: 🌏 国外, <<: *default}
  - {name: 🇨🇳 国内, <<: *default}
  - {name: 🐟 漏网之鱼, <<: *default}
  - {name: 🧪 测试, <<: *default}

  # 区域故转组 (Fallback)
  - {name: 🇭🇰 香港-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🇭🇰 香港-手动, 🇭🇰 香港-自动]}
  - {name: 🇲🇴 澳门-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🇲🇴 澳门-手动, 🇲🇴 澳门-自动]}
  - {name: 🇹🇼 台湾-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🇹🇼 台湾-手动, 🇹🇼 台湾-自动]}
  - {name: 🇯🇵 日本-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🇯🇵 日本-手动, 🇯🇵 日本-自动]}
  - {name: 🇰🇷 韩国-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🇰🇷 韩国-手动, 🇰🇷 韩国-自动]}
  - {name: 🇸🇬 新加坡-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🇸🇬 新加坡-手动, 🇸🇬 新加坡-自动]}
  - {name: 🇺🇸 美国-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🇺🇸 美国-手动, 🇺🇸 美国-自动]}
  - {name: 🌍 其他-故转, type: fallback, hidden: true, url: https://www.gstatic.com/generate_204, interval: 60, proxies: [🌍 其他-手动, 🌍 其他-自动]}

  # 区域手动组 (Select)
  - {name: 🇭🇰 香港-手动, type: select, include-all: true, filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"}
  - {name: 🇲🇴 澳门-手动, type: select, include-all: true, filter: "(?=.*(澳门|Macau|MAC|MO)).*$"}
  - {name: 🇹🇼 台湾-手动, type: select, include-all: true, filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"}
  - {name: 🇯🇵 日本-手动, type: select, include-all: true, filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"}
  - {name: 🇰🇷 韩国-手动, type: select, include-all: true, filter: "(?=.*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)).*$"}
  - {name: 🇸🇬 新加坡-手动, type: select, include-all: true, filter: "(?=.*(广新|新加坡|狮城|SG|Singapore|🇸🇬|SGP)).*$"}
  - {name: 🇺🇸 美国-手动, type: select, include-all: true, filter: "(?=.*(广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"}
  - {name: 🌍 其他-手动, type: select, include-all: true, filter: "^((?!(🚀 直连|🛑 拒绝|广港|香港|澳门|港澳|Macau|MAC|MO|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广新|新加坡|狮城|SG|Singapore|🇸🇬|SGP|广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).)*$"}

  # 区域自动组 (URL-Test)
  - {name: 🇭🇰 香港-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$", exclude-filter: "(?=.*(澳门|Macau|MAC|MO)).*$"}
  - {name: 🇲🇴 澳门-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, filter: "(?=.*(澳门|Macau|MAC|MO)).*$"}
  - {name: 🇹🇼 台湾-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"}
  - {name: 🇯🇵 日本-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"}
  - {name: 🇰🇷 韩国-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, filter: "(?=.*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)).*$"}
  - {name: 🇸🇬 新加坡-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, filter: "(?=.*(广新|新加坡|狮城|SG|Singapore|🇸🇬|SGP)).*$"}
  - {name: 🇺🇸 美国-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, filter: "(?=.*(广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"}
  - {name: 🌍 其他-自动, type: url-test, hidden: true, include-all: true, tolerance: 50, interval: 100, exclude-filter: "(🚀 直连|🛑 拒绝|广港|香港|澳门|港澳|Macau|MAC|MO|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广新|新加坡|狮城|SG|Singapore|🇸🇬|SGP|广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)"}

